name: KRX NXT operations hotfix V4 (5x full regression guarded)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: krx-nxt-operations-hotfix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Exact anchor check, no modifications
        run: python KRX_NXT_OPERATIONS_HOTFIX_20261116_V4.py --check
      - name: Apply operations-only patch and run regression tests
        run: python KRX_NXT_OPERATIONS_HOTFIX_20261116_V4.py --apply
      - name: Verify source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          if git diff --name-only | grep -Ev '^operations/(engine.py|integration.py|dashboard.html|test_engine.py|test_v41.py)$'; then
            echo 'Refusing modifications outside operations layer' >&2
            exit 1
          fi
      - name: Commit guarded changes to the existing repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/engine.py operations/integration.py operations/dashboard.html operations/test_engine.py operations/test_v41.py
          if git diff --cached --quiet; then
            echo 'No changes: already applied'
            exit 0
          fi
          git commit -m 'Fix KRX/NXT dashboard counts, full view, session gate, dates and API load'
          git push origin HEAD:main
