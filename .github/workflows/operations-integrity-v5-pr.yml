name: Operations V5 safe integrity migration PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  integrity-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original main without modifying it
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The production LS fixture imports pandas even though the code migration
      # itself is broker-agnostic. Match that dependency in CI; do not skip tests.
      - name: Install LS fixture test dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26" "pandas>=2.1" "requests>=2.31" "websocket-client>=1.8" "psycopg[binary]>=3.2"
      - name: Check audited source hashes and patch anchors before writing
        run: python operations/apply_integrity_v5.py --repo . --check > /tmp/operations-v5.diff
      - name: Work on a review branch, not on main
        run: git switch -c fix/operations-integrity-v5-${{ github.run_id }}
      - name: Apply permanent source changes on review branch
        run: python operations/apply_integrity_v5.py --repo . --apply
      - name: Validate syntax and existing + new Python regression tests
        run: |
          python -m py_compile operations/engine.py operations/candidate_integrity.py operations/test_engine.py operations/test_candidate_integrity.py
          python -m unittest operations.test_engine operations.test_v41 operations.test_candidate_integrity -q
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('operations/dashboard.html').read_text(encoding='utf-8')
          assert s.count('<script>') == 1 and s.count('</script>') == 1
          Path('/tmp/v5-dashboard.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0], encoding='utf-8')
          PY
          node --check /tmp/v5-dashboard.js
      - name: Create review branch commit (not a production deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/engine.py operations/dashboard.html operations/test_engine.py operations/candidate_integrity.py operations/test_candidate_integrity.py
          git commit -m "fix: evidence-based candidate lifecycle and visible NXT price"
          git push origin HEAD
      - name: Open pull request for manual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "fix/operations-integrity-v5-${{ github.run_id }}" \
            --title "Operations V5: verified candidate exits, DATA_HOLD, visible NXT quotes" \
            --body "Permanent source migration reviewed by automated tests. The existing KIS/LS collectors, Dockerfile, authentication, risk veto and R:R gates are untouched. Review this PR and merge manually; do not infer BUY from PENDING or REST request timestamps."
