services:
  - type: web
    name: pulse-edge-v1271-ls-onebox
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: LS_APP_KEY
        sync: false
      - key: LS_APP_SECRET
        sync: false
      - key: PULSE_BRIDGE_TOKEN
        generateValue: true
      - key: LS_OPENAPI_ENABLED
        value: "true"
      - key: AUTO_BUILD_LS_UNIVERSE
        value: "false"
      - key: V127_POLL_SECONDS
        value: "60"
      - key: PULSE_MIN_MARKET_CAP_KRW
        value: "200000000000"
      - key: PULSE_DEEP_TARGET_MAX
        value: "30"
      - key: LS_REALTIME_TARGET_MAX
        value: "30"
    disk:
      name: pulse-ls-data
      mountPath: /data
      sizeGB: 1
